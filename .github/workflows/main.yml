name: Generate Datas

on:
  schedule: # execute once every 12 hours
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  build:
    name: Jobs to update datas
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Snake Animation
      - uses: Platane/snk@v3.5.0
        id: snake-gif
        with:
          github_user_name: flaviafogaca
          outputs: |
            dist/github-contribution-grid-snake.svg

      # Profile stats / top languages card (self-hosted, no third-party service dependency)
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: flaviafogaca
          template: classic
          base: header, activity, community, repositories, metadata
          plugin_languages: yes
          output_action: none
          filename: dist/metrics.svg
          plugins_errors_fatal: yes

      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
